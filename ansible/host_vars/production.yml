---
# set.bruntrager.win on gaybor_new. Requests go
# nginx -> waker (127.0.0.1:8000, ~/sysperf/waker) -> react-set (app_port).
# waker starts and stops the pm2 process on demand, so it may be stopped
# between deploys; the restart step starts it either way.
# nginx serves preact-client/dist statically (ansible/files/nginx.set.conf).
project_root: /home/william/web/react-set
target_branch: master
# Must match name in ecosystem.config.cjs and pm2_name in ~/sysperf/waker/apps.config.ts.
pm2_name: react-set
pm2_node_version: v24.12.0
# Must match PORT in ecosystem.config.cjs and the set entry in
# ~/sysperf/waker/apps.config.ts.
app_port: 10817
public_url: https://set.bruntrager.win
db_dir: database
db_file: react-db-production.sqlite3
